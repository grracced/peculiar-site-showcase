version: '3.8'

# Local Development Overrides
# This file is automatically read by `docker compose up` and merges with `docker-compose.yml`.
# It adds port mapping for local access and binds local volumes for instant hot-reloading.

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    ports:
      - "3001:3001"
    volumes:
      # Mount the entire monorepo to allow cross-package hot-reloading
      - .:/app
      # Prevent host node_modules from overriding container node_modules
      - /app/node_modules
      - /app/apps/backend/node_modules
    # Run the dev command instead of the production start command
    command: pnpm --filter backend run dev

  frontend:
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/frontend/node_modules
    command: pnpm --filter frontend run dev
