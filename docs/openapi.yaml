openapi: 3.0.3
info:
  title: VerifAI API Specification
  description: API documentation for VerifAI - Document Verification SaaS on Hedera.
  version: 1.0.0
servers:
  - url: http://localhost:3001/api/v1
    description: Local development server
paths:
  /users:
    post:
      summary: Register a new user
      description: Validates names, email, and password strength, and inserts both user and profile rows transactionally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
                - confirmPassword
              properties:
                firstName:
                  type: string
                  example: John
                  minLength: 2
                  maxLength: 50
                lastName:
                  type: string
                  example: Doe
                  minLength: 2
                  maxLength: 50
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  example: Password123!
                confirmPassword:
                  type: string
                  format: password
                  example: Password123!
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: User registered successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 2d94cfbf-b7c1-4045-812f-9174dfb2cc22
                      email:
                        type: string
                        example: john.doe@example.com
                      role:
                        type: string
                        example: USER
                      status:
                        type: string
                        example: PENDING_VERIFICATION
                      emailVerified:
                        type: boolean
                        example: false
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      profile:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            example: e93ab630-fbf3-4623-a128-bbbe07cf90b2
                          fullName:
                            type: string
                            example: John Doe
                          avatarUrl:
                            type: string
                            nullable: true
                          subscriptionTier:
                            type: string
                            example: FREE
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Email Already Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'

  /auth/login:
    post:
      summary: User Login
      description: Verifies user credentials using Argon2. Blocks unverified or suspended users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  example: Password123!
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: User logged in successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 2d94cfbf-b7c1-4045-812f-9174dfb2cc22
                      email:
                        type: string
                        example: john.doe@example.com
                      role:
                        type: string
                        example: USER
                      status:
                        type: string
                        example: ACTIVE
                      emailVerified:
                        type: boolean
                        example: true
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Invalid Credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 401
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Invalid email or password
        '403':
          description: Access Forbidden (Unverified/Suspended)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 403
                  error:
                    type: string
                    example: Forbidden
                  message:
                    type: string
                    example: Email address has not been verified

  /auth/verify-email:
    get:
      summary: Verify User Email
      description: Accepts a query parameter verification token, validates it against expiration and user, and marks emailVerified = true.
      parameters:
        - name: token
          in: query
          required: true
          description: Plaintext verification token
          schema:
            type: string
            example: c4ca4238a0b923820dcc509a6f75849b
      responses:
        '200':
          description: Email verified successfully or already verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Email verified successfully
        '400':
          description: Invalid or Expired Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: The verification link is invalid.

  /auth/forgot-password:
    post:
      summary: Request Password Reset
      description: Initiates the password reset process. Sends an email containing a secure link. Always returns 200 OK to prevent email enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
      responses:
        '200':
          description: Standard enumeration-safe success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: If the email is registered, a password reset link has been sent.

  /auth/reset-password:
    post:
      summary: Reset Password using Token
      description: Accepts a verification token and a new password, validates the token against expiration, and updates the credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
                - confirmPassword
              properties:
                token:
                  type: string
                  example: d12a9eb74b92b6a2df149ea8cbcf6473
                newPassword:
                  type: string
                  format: password
                  example: NewPassword123!
                confirmPassword:
                  type: string
                  format: password
                  example: NewPassword123!
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Password reset successfully.
        '400':
          description: Invalid, Expired Token or Password Policy Validation Failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: The verification link has expired.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained from the /auth/login endpoint.
        Include in the Authorization header as: Bearer <token>
  schemas:
    ValidationError:
      type: object
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Validation Error
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: A valid email address is required.
    ConflictError:
      type: object
      properties:
        status:
          type: integer
          example: 409
        error:
          type: string
          example: Conflict
        message:
          type: string
          example: The email address "john.doe@example.com" is already registered.
    UnauthorizedError:
      type: object
      properties:
        status:
          type: integer
          example: 401
        error:
          type: string
          example: Unauthorized
        message:
          type: string
          example: Unauthorized access

