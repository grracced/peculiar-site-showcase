<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="t d"><title id="t">Authorization flow</title><desc id="d">User to roles to academic authority to historical scope to resource, with an example matrix.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><rect width="900" height="640" fill="#ffffff"/><text x="450" y="28" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#1f2430" font-weight="700" text-anchor="middle">Scoped authorization</text><rect x="20" y="50" width="160" height="72" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="100.0" y="72" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">User</text><text x="100.0" y="90" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">authenticated</text><text x="100.0" y="106" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">staff session</text><line x1="180" y1="86" x2="196" y2="86" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="196" y="50" width="160" height="72" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="276.0" y="72" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Roles</text><text x="276.0" y="90" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">many-to-many active</text><text x="276.0" y="106" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">roles, union of perms</text><line x1="356" y1="86" x2="372" y2="86" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="372" y="50" width="160" height="72" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="452.0" y="72" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Academic authority</text><text x="452.0" y="90" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">class / subject</text><text x="452.0" y="106" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">assignments per session</text><line x1="532" y1="86" x2="548" y2="86" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="548" y="50" width="160" height="72" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="628.0" y="72" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Historical scope</text><text x="628.0" y="90" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">session · term · class</text><text x="628.0" y="106" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">category · subject</text><line x1="708" y1="86" x2="724" y2="86" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="724" y="50" width="160" height="72" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="804.0" y="72" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Resource</text><text x="804.0" y="90" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">result set · export</text><text x="804.0" y="106" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">report card</text><text x="450" y="152" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2430" font-weight="600" text-anchor="middle">Decision splits into two independent questions</text><rect x="90" y="168" width="340" height="70" rx="6" fill="#e8f5ee" stroke="#1f7a4d" stroke-width="1.2"/><text x="260.0" y="190" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f7a4d" font-weight="600" text-anchor="middle">VIEW / EXPORT</text><text x="260.0" y="208" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">Class teacher: every subject in the led class</text><text x="260.0" y="224" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">Subject teacher: assigned subjects</text><rect x="470" y="168" width="340" height="70" rx="6" fill="#fbeceb" stroke="#a3312b" stroke-width="1.2"/><text x="640.0" y="190" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#a3312b" font-weight="600" text-anchor="middle">MANAGE (enter · submit · configure)</text><text x="640.0" y="208" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">Subject-assignment authority only</text><text x="640.0" y="224" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">Class leadership does not imply it</text><text x="450" y="272" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2430" font-weight="600" text-anchor="middle">Worked example: one teacher, two assignments</text><text x="450" y="292" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="middle">Class Teacher of JSS 1  ·  Subject Teacher of SS 1 Mathematics</text><rect x="100" y="308" width="700" height="30" rx="4" fill="#ebedf1" stroke="#9aa3b2" stroke-width="1.2"/><text x="130" y="328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2430" font-weight="600" text-anchor="start">Resource</text><text x="475" y="328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2430" font-weight="600" text-anchor="middle">View</text><text x="605" y="328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2430" font-weight="600" text-anchor="middle">Export</text><text x="735" y="328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2430" font-weight="600" text-anchor="middle">Edit / manage</text><rect x="100" y="344" width="700" height="32" rx="2" fill="#fff" stroke="#e1e4ea" stroke-width="1.2"/><text x="130" y="365" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2430" font-weight="400" text-anchor="start">JSS 1 English</text><text x="475" y="365" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f7a4d" font-weight="700" text-anchor="middle">✓</text><text x="605" y="365" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f7a4d" font-weight="700" text-anchor="middle">✓</text><text x="735" y="365" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#a3312b" font-weight="700" text-anchor="middle">✗</text><rect x="100" y="376" width="700" height="32" rx="2" fill="#fff" stroke="#e1e4ea" stroke-width="1.2"/><text x="130" y="397" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2430" font-weight="400" text-anchor="start">JSS 1 Mathematics</text><text x="475" y="397" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f7a4d" font-weight="700" text-anchor="middle">✓</text><text x="605" y="397" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f7a4d" font-weight="700" text-anchor="middle">✓</text><text x="735" y="397" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#a3312b" font-weight="700" text-anchor="middle">✗</text><rect x="100" y="408" width="700" height="32" rx="2" fill="#fff" stroke="#e1e4ea" stroke-width="1.2"/><text x="130" y="429" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2430" font-weight="400" text-anchor="start">SS 1 Mathematics</text><text x="475" y="429" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f7a4d" font-weight="700" text-anchor="middle">✓</text><text x="605" y="429" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f7a4d" font-weight="700" text-anchor="middle">✓</text><text x="735" y="429" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f7a4d" font-weight="700" text-anchor="middle">✓</text><rect x="100" y="440" width="700" height="32" rx="2" fill="#fff" stroke="#e1e4ea" stroke-width="1.2"/><text x="130" y="461" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2430" font-weight="400" text-anchor="start">SS 1 English (no assignment)</text><text x="475" y="461" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#a3312b" font-weight="700" text-anchor="middle">✗</text><text x="605" y="461" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#a3312b" font-weight="700" text-anchor="middle">✗</text><text x="735" y="461" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#a3312b" font-weight="700" text-anchor="middle">✗</text><rect x="100" y="500" width="700" height="96" rx="6" fill="#f1eaf9" stroke="#3b176d" stroke-width="1.2"/><text x="450.0" y="522" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Why this matters</text><text x="450.0" y="540" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">The check is &#x27;does this actor hold this authority for this exact historical scope?&#x27;,</text><text x="450.0" y="556" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">not &#x27;is this person a teacher?&#x27;. Leadership of a class in one session grants nothing</text><text x="450.0" y="572" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">in another session, and read authority is never widened into write authority.</text><text x="450" y="620" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6472" font-weight="400" text-anchor="middle">Illustrative example with synthetic names; not production data.</text></svg>
