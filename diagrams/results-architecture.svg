<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-labelledby="t d"><title id="t">Result architecture</title><desc id="d">Configuration, entry, approval, authoritative read models, explorer, export engine, report card.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><rect width="900" height="700" fill="#ffffff"/><text x="450" y="28" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#1f2430" font-weight="700" text-anchor="middle">Result architecture</text><rect x="120" y="48" width="660" height="64" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="450.0" y="70" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Result configuration</text><text x="450.0" y="88" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">per session · term · level · assessment limits · grade bands · locked once used</text><line x1="450" y1="112" x2="450" y2="138" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="120" y="138" width="660" height="64" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="450.0" y="160" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Result entry</text><text x="450.0" y="178" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">subject teacher · four assessment components · server-calculated totals and grades</text><line x1="450" y1="202" x2="450" y2="228" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="120" y="228" width="660" height="64" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="450.0" y="250" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Review and approval</text><text x="450.0" y="268" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">submit → review → approve / return · approved state immutable for ordinary teachers · amendments by senior roles, audited</text><line x1="450" y1="292" x2="450" y2="318" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="120" y="318" width="660" height="64" rx="6" fill="#f1eaf9" stroke="#3b176d" stroke-width="1.2"/><text x="450.0" y="340" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Authoritative read models</text><text x="450.0" y="358" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">one calculation service · subject/class view · student view · class consolidated view · report-card model</text><line x1="450" y1="382" x2="450" y2="408" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="120" y="408" width="660" height="64" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="450.0" y="430" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Result Explorer</text><text x="450.0" y="448" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">Student Result · Subject/Class Result · Class Consolidated Result (views over the same data)</text><line x1="450" y1="472" x2="450" y2="498" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="120" y="498" width="660" height="64" rx="6" fill="#f1eaf9" stroke="#3b176d" stroke-width="1.2"/><text x="450.0" y="520" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Unified export engine</text><text x="450.0" y="538" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">PDF · CSV · ZIP  —  renderers consume read models; they never recalculate</text><line x1="450" y1="562" x2="450" y2="588" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="120" y="588" width="660" height="64" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="450.0" y="610" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Official report card</text><text x="450.0" y="628" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">adds conduct, remarks and next-term details on top of the same read model</text><text x="450" y="690" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">Highlighted: the two seams that prevent duplicated calculation and inconsistent output.</text></svg>
