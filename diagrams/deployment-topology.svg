<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d"><title id="t">Deployment topology</title><desc id="d">Conceptual deployment: GitHub Actions validation, controlled deploy on a single VM, timers and off-server backups.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><rect width="900" height="600" fill="#ffffff"/><text x="450" y="28" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#1f2430" font-weight="700" text-anchor="middle">Deployment topology (conceptual, no infrastructure identifiers)</text><rect x="30" y="60" width="180" height="56" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="120.0" y="82" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Private repository</text><text x="120.0" y="100" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">push / merge to main</text><line x1="210" y1="88" x2="250" y2="88" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="250" y="60" width="230" height="56" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="365.0" y="82" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">CI validation</text><text x="365.0" y="100" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">PHP lint · JS check</text><text x="365.0" y="116" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">migration safety · MySQL run</text><line x1="480" y1="88" x2="520" y2="88" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="520" y="60" width="200" height="56" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="620.0" y="82" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Restricted SSH deploy</text><text x="620.0" y="100" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">one deploy command</text><line x1="620" y1="116" x2="620" y2="160" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="30" y="160" width="840" height="300" rx="6" fill="#fff" stroke="#9aa3b2" stroke-width="1.2" stroke-dasharray="5 4"/><text x="450" y="182" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#5b6472" font-weight="600" text-anchor="middle">Single cloud VM (Ubuntu LTS)</text><rect x="50" y="200" width="230" height="74" rx="6" fill="#f1eaf9" stroke="#3b176d" stroke-width="1.2"/><text x="165.0" y="222" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Controlled deploy orchestrator</text><text x="165.0" y="240" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">classify release</text><text x="165.0" y="256" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">Mode A: app · Mode B: migration</text><rect x="310" y="200" width="250" height="74" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="435.0" y="222" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Request path</text><text x="435.0" y="240" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">Nginx → PHP-FPM pools → MySQL</text><text x="435.0" y="256" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">public / staff / exams surfaces separated</text><rect x="590" y="200" width="260" height="74" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="720.0" y="222" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Release safety</text><text x="720.0" y="240" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">backup first · forward-only migrations</text><text x="720.0" y="256" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">health check after activation · fail closed</text><rect x="50" y="310" width="230" height="120" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="165.0" y="332" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">systemd timers</text><text x="165.0" y="350" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">scheduled verified backups</text><text x="165.0" y="366" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">health check</text><text x="165.0" y="382" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">communications worker</text><rect x="310" y="310" width="250" height="120" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="435.0" y="332" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Backups</text><text x="435.0" y="350" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">dump + integrity hash + manifest</text><text x="435.0" y="366" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">local retention with restore test</text><text x="435.0" y="382" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">off-server copy</text><rect x="590" y="310" width="260" height="120" rx="6" fill="#fff" stroke="#9aa3b2" stroke-width="1.2"/><text x="720.0" y="332" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Not used (by design)</text><text x="720.0" y="350" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">Docker · Kubernetes · load balancer</text><text x="720.0" y="366" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">Redis / queue server · separate DB host</text><text x="720.0" y="382" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">(small single-VM footprint)</text><line x1="280" y1="237" x2="310" y2="237" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><line x1="560" y1="237" x2="590" y2="237" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><line x1="180" y1="274" x2="180" y2="310" stroke="#5b6472" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/><line x1="435" y1="274" x2="435" y2="310" stroke="#5b6472" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="450" y="490" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">Infrastructure detail (addresses, hostnames, keys, bucket names) is intentionally omitted from this public repository.</text><text x="450" y="512" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">Only components confirmed in the private repository&#x27;s deployment configuration are shown.</text></svg>
