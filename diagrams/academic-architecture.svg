<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d"><title id="t">Academic architecture</title><desc id="d">Session, Term, Class, Category, Subject, Enrollment, Result chain with historical context.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><rect width="900" height="420" fill="#ffffff"/><text x="450" y="28" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#1f2430" font-weight="700" text-anchor="middle">Academic architecture and historical context</text><rect x="20" y="70" width="112" height="62" rx="6" fill="#f1eaf9" stroke="#3b176d" stroke-width="1.2"/><text x="76.0" y="92" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Session</text><text x="76.0" y="110" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">2026/2027</text><line x1="132" y1="101" x2="148" y2="101" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="148" y="70" width="112" height="62" rx="6" fill="#f1eaf9" stroke="#3b176d" stroke-width="1.2"/><text x="204.0" y="92" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Term</text><text x="204.0" y="110" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">First Term</text><line x1="260" y1="101" x2="276" y2="101" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="276" y="70" width="112" height="62" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="332.0" y="92" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Class</text><text x="332.0" y="110" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">JSS 1</text><line x1="388" y1="101" x2="404" y2="101" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="404" y="70" width="112" height="62" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="460.0" y="92" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Category</text><text x="460.0" y="110" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">General</text><line x1="516" y1="101" x2="532" y2="101" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="532" y="70" width="112" height="62" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="588.0" y="92" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Subject</text><text x="588.0" y="110" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">Offering</text><line x1="644" y1="101" x2="660" y2="101" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="660" y="70" width="112" height="62" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="716.0" y="92" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Enrollment</text><text x="716.0" y="110" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">student ⇄ class</text><line x1="772" y1="101" x2="788" y2="101" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="788" y="70" width="112" height="62" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="844.0" y="92" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Result</text><text x="844.0" y="110" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">scores per set</text><rect x="40" y="170" width="820" height="90" rx="6" fill="#fff" stroke="#9aa3b2" stroke-width="1.2" stroke-dasharray="5 4"/><text x="450" y="192" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2430" font-weight="600" text-anchor="middle">Every result read carries an explicit scope key</text><text x="450" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="middle">Session + Term + Class + Category + Subject   (+ Student when the view is student-specific)</text><text x="450" y="238" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="middle">Historical selections never fall back to the school&#x27;s active session or term.</text><rect x="40" y="290" width="390" height="96" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="235.0" y="312" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Derived, not duplicated</text><text x="235.0" y="330" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">Which subjects a student takes and which students a subject</text><text x="235.0" y="346" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">applies to are derived from class/category curriculum</text><text x="235.0" y="362" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">and enrollment history. No per-student subject mirror table.</text><rect x="470" y="290" width="390" height="96" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="665.0" y="312" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Active context ≠ viewing context</text><text x="665.0" y="330" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">The active session/term drives current operations.</text><text x="665.0" y="346" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">Viewing 2019/2020 Term 3 results changes nothing:</text><text x="665.0" y="362" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">no lock, no move, no copy, no lifecycle change.</text></svg>
