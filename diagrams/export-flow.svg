<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d"><title id="t">Export flow</title><desc id="d">Unified result export pipeline: normalize, validate, authorize, dispatch, read model, renderer, audit, response.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><rect width="900" height="600" fill="#ffffff"/><text x="450" y="28" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#1f2430" font-weight="700" text-anchor="middle">Unified export pipeline</text><rect x="120" y="44" width="220" height="44" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="230.0" y="71.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">One canonical export route</text><line x1="230" y1="88" x2="230" y2="112" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="112" width="340" height="42" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="230.0" y="138.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Normalize request</text><text x="420" y="138" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">fixed export types · trimmed ids</text><line x1="230" y1="154" x2="230" y2="170" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="170" width="340" height="42" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="230.0" y="196.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Validate request</text><text x="420" y="196" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">required scope keys present and coherent</text><line x1="230" y1="212" x2="230" y2="228" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="228" width="340" height="42" rx="6" fill="#f1eaf9" stroke="#3b176d" stroke-width="1.2"/><text x="230.0" y="254.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Authorize scope</text><text x="420" y="254" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">same view authority as the Explorer</text><line x1="230" y1="270" x2="230" y2="286" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="286" width="340" height="42" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="230.0" y="312.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Dispatch</text><text x="420" y="312" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">one dispatcher selects the family</text><line x1="230" y1="328" x2="230" y2="344" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="344" width="340" height="42" rx="6" fill="#f1eaf9" stroke="#3b176d" stroke-width="1.2"/><text x="230.0" y="370.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Authoritative read model</text><text x="420" y="370" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">calculation, curriculum and roster services</text><line x1="230" y1="386" x2="230" y2="402" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="402" width="340" height="42" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="230.0" y="428.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Renderer</text><text x="420" y="428" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">PDF · CSV · ZIP (thin, no calculation)</text><line x1="230" y1="444" x2="230" y2="460" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="460" width="340" height="42" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="230.0" y="486.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Audit</text><text x="420" y="486" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">who exported what scope</text><line x1="230" y1="502" x2="230" y2="518" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="518" width="340" height="42" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="230.0" y="544.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Response</text><text x="420" y="544" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">private, no-store; temp files cleaned up</text><text x="450" y="588" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">Export types are a closed set; report-card exports stay on their own permission domain.</text></svg>
