<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="t d"><title id="t">System architecture</title><desc id="d">Browser to Nginx host routing to isolated PHP-FPM pools to MySQL, with application modules.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><rect width="900" height="640" fill="#ffffff"/><text x="450" y="28" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#1f2430" font-weight="700" text-anchor="middle">System architecture (conceptual)</text><rect x="300" y="50" width="300" height="54" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="450.0" y="72" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Browsers</text><text x="450.0" y="90" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">students · parents · staff · exam candidates</text><line x1="450" y1="104" x2="450" y2="132" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="250" y="132" width="400" height="58" rx="6" fill="#f1eaf9" stroke="#3b176d" stroke-width="1.2"/><text x="450.0" y="154" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2430" font-weight="600" text-anchor="middle">Nginx</text><text x="450.0" y="172" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">TLS · host-based routing (public vs staff surface)</text><line x1="450" y1="190" x2="135" y2="230" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/><rect x="40" y="230" width="190" height="52" rx="6" fill="#f6f7f9" stroke="#9aa3b2" stroke-width="1.2"/><text x="135.0" y="252" font-family="-a